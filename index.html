<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <aside>
        <h1>NyieunTudu</h1>
    </aside>
    <main>
        <div class="date-info">
            <h1>Today</h1>
            <p>Date</p>
        </div>
        <div class="todo-card">
            <form action="">
                <label for=""></label>
                <input type="text" name="" id="">
            </form>
        </div>
        <div class="todo-table">
            <article>
                <div class="task-info">
                    <img src="todo-button" alt="">
                    <h1>My First todo</h1>
                    <p>detailed todo</p>
                </div>
                <div class="task-deadline">
                    <img src="date-icon" alt="">
                    <p>deadline todo</p>
                </div>
                <div class="task-priority">
                    <img src="priority-icon" alt="">
                    <p>priority</p>
                </div>
                <div class="task-action">
                    <img src="edit-icon" alt="">
                    <p>Edit</p>
                    <img src="del-icon" alt="">
                    <p>delete</p>
                </div>
            </article>
        </div>
        <footer>
            Copyright 2026
        </footer>
    </main>
