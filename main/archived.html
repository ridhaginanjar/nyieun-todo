<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NyieunTudus</title>
    <link rel="stylesheet" href="./style-archived.css">
</head>

<body>
    <header>
        <nav>
            <h1>NyieunTudu</h1>
            <div id="nav-link">
                <a href="./main.html">Main</a>
                <a href="#">Archived</a>
            </div>
        </nav>
    </header>
    <main>
        <div class="archived-list">
            <h1>Archived Task</h1>
            <div class="archived-container">
                <!-- <article class="archived-item" data-id="">
                    <p>Archived Task 1</p>
                    <button type="button">
                        <img src="../assets/redo.svg" alt="">
                    </button>
                </article> -->
            </div>
        </div>
    </main>
    <footer>
        <p>Copyright 2026 Belajar</p>
    </footer>

    <script>
        //Load Archived Data
        function loadArchived(e) {
            const dataTodo = JSON.parse(localStorage.getItem("todos")) || [];
            const archivedData = dataTodo.filter(dataTodo => dataTodo.isArchived == true)

            const archivedContainer = document.querySelector(".archived-container")
            archivedContainer.innerHTML = ""

            archivedData.forEach(item => {
                const archivedHTML = `
                    <article class="archived-item" data-id=${item.id}>
                        <p>${item.todo}</p>
                        <button type="button">
                            <img src="../assets/redo.svg" alt="">
                        </button>
                    </article>
                `
                archivedContainer.insertAdjacentHTML('beforeend', archivedHTML)
            });
        }

        // Update Data
        function updateTodo(e) {
            const dataTodo = JSON.parse(localStorage.getItem("todos")) || [];
            const archivedTodo = dataTodo.filter(data => data.isArchived == true)


            // console.log(archivedTodo)
            const archivedTask = e.target.closest(".archived-item")
            const targetedId = archivedTask.dataset.id

            const updateData = dataTodo.map(item => {
                if (item.id == targetedId) {
                    return { ...item, isArchived: false}
                }

                return item
            })

            localStorage.setItem("todos", JSON.stringify(updateData))
            loadArchived();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadArchived();

            const archivedTask = document.querySelectorAll(".archived-container")
                archivedTask.forEach(item => {
                    item.addEventListener("click", updateTodo)
            })
        })
    </script>
</body>

</html>
