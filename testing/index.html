<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-test.css">
    <style>
        .checkbox-wrapper input{
            opacity: 0;
            position: absolute;
        }
        /* .demo-checkbox:checked {
            accent-color:aqua;
        } */
        .box {
            width: 20px;
            height: 20px;

            border: 2px solid red;
            border-radius: 4px;

            display: flex;
        }
        .checkbox-wrapper input:checked + .box {
            background-color: aqua;
        }
        .checkbox-wrapper input:checked + .box::after {
            content: "✓";
        }
        .box:hover{
            background-color: green;
        }

    </style>
    <title>Document</title>
</head>
<body>
    <label class="checkbox-wrapper">
        <input type="checkbox" class="demo-checkbox">
        <span class="box"></span>
        Selese
    </label>
</body>
</html>
